
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Value Health | Connected Healthcare Intelligence</title>

<style>

/* =========================================
   GLOBAL RESET
========================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* =========================================
   HERO BACKGROUND
========================================= */

.hero {
    --orange: #FE602F;
    --blue: #023A94;
    --deep-blue: #013476;

    position: relative;
    isolation: isolate;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    overflow: hidden;

    display: flex;
    align-items: center;

    background: radial-gradient(
        circle at 50% 50%,
        #070b1e 0%,
        #020308 75%
    );

    color: #ffffff;
}

/* WEBGL CANVAS */

#hero-canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
    pointer-events: none;

    z-index: 0;
}

/* DARK OVERLAY FOR PARTICLE CONTRAST */

.hero-overlay {
    position: absolute;
    inset: 0;

    z-index: 1;

    background: radial-gradient(
        ellipse at 42% 48%,
        rgba(2, 3, 10, 0.18) 0%,
        rgba(2, 3, 10, 0.24) 48%,
        rgba(2, 3, 10, 0.62) 100%
    );

    pointer-events: none;
}

/* =========================================
   VALUE HEALTH HERO
========================================= */

.vh-hero {
    --orange: #FE602F;
    --blue: #023A94;
    --deep-blue: #013476;

    position: relative;
    isolation: isolate;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    align-items: center;

    background: transparent;

    color: #ffffff;

    font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;

    -webkit-font-smoothing: antialiased;
}

/* MAIN CONTAINER */

.vh-container {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 1480px;

    margin: 0 auto;
    padding: 40px 55px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* LEFT CONTENT */

.vh-copy {
    position: relative;
    z-index: 3;

    width: 62%;
    max-width: 850px;

    text-align: left;
}

/* LABEL */

.vh-label {
    margin: 0 0 22px;

    color: var(--orange);

    font-size: 25px;
    font-weight: 600;

    line-height: 1.4;
    letter-spacing: .28px;
}

/* HEADLINE */

.vh-copy h1 {
    margin: 0;

    color: #ffffff;

    font-size: clamp(48px, 5.2vw, 72px);

    font-weight: 500;
    line-height: 1.08;

    letter-spacing: -1.5px;
}

.vh-copy h1 span {
    display: block;

    color: #a9bcff;

    font-weight: 500;
}

/* DESCRIPTION */

.vh-description {
    max-width: 790px;

    margin: 26px 0 0;

    color: rgba(235, 240, 255, .82);

    font-size: 22px;
    font-weight: 350;

    line-height: 1.6;
    letter-spacing: .15px;
}

/* =========================================
   NAVIGATION CARDS
========================================= */

.vh-bottom-nav {
    position: relative;
    z-index: 4;

    display: grid;

    grid-template-columns: repeat(3, minmax(0, 1fr));

    gap: 14px;

    width: 100%;
    max-width: 700px;

    margin: 32px 0 0;
}

.vh-nav-card {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    min-width: 0;
    min-height: 58px;

    padding: 12px 20px;

    overflow: hidden;

    border-radius: 10px;

    background: rgba(255, 255, 255, .08);

    border: 1px solid rgba(180, 198, 255, .27);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: #ffffff !important;
    text-decoration: none !important;

    transition:
        background .3s ease,
        border-color .3s ease,
        transform .3s ease;
}

.vh-nav-title {
    display: block;

    font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;

    font-size: 15px;
    font-weight: 600;

    line-height: 22px;
    letter-spacing: -.2px;

    color: #ffffff;
}

.vh-nav-card:hover {
    background: rgba(254, 96, 47, .13);

    border-color: rgba(254, 96, 47, .75);

    transform: translateY(-3px);
}

.vh-nav-card::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 2px;

    background: var(--orange);

    transition: width .3s ease;
}

.vh-nav-card:hover::after {
    width: 100%;
}

/* =========================================
   COLLABORATION LOGOS
========================================= */

.collaboration-mark {
    --join-duration: 1.25s;

    position: absolute;
    z-index: 5;

    top: 48%;
    right: 4%;

    transform: translateY(-50%);

    width: min(590px, 43%);

    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: clamp(14px, 2.2vw, 30px);

    overflow: visible;
}

.collaboration-mark__logo {
    display: block;

    height: auto;

    object-fit: contain;

    opacity: 0;

    will-change: transform, opacity;
}

/* VALUE HEALTH LOGO */

.collaboration-mark__value {
    width: min(270px, 44%);

    animation:
        value-joins var(--join-duration)
        cubic-bezier(.2,.75,.25,1) .12s forwards;
}

/* AXS27 LOGO */

.collaboration-mark__axs {
    width: min(280px, 45%);

    animation:
        axs-joins var(--join-duration)
        cubic-bezier(.2,.75,.25,1) .12s forwards;
}

/* DIVIDER */

.collaboration-mark__divider {
    width: 1px;

    height: clamp(36px, 5vw, 54px);

    flex: 0 0 1px;

    background: rgba(255,255,255,.5);

    transform: scaleY(0);
    transform-origin: center;

    animation: divider-appears .45s ease .88s forwards;
}

/* =========================================
   LOGO ANIMATIONS
========================================= */

@keyframes value-joins {

    0% {
        opacity: 0;
        transform: translateX(-72px);
    }

    70% {
        opacity: 1;
        transform: translateX(5px);
    }

    100% {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes axs-joins {

    0% {
        opacity: 0;
        transform: translateX(72px);
    }

    70% {
        opacity: 1;
        transform: translateX(-5px);
    }

    100% {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes divider-appears {

    to {
        transform: scaleY(1);
    }
}

/* =========================================
   LAPTOP RESPONSIVE
========================================= */

@media (max-width: 1100px) {

    .vh-container {
        padding: 35px;
    }

    .vh-copy {
        width: 60%;
    }

    .vh-copy h1 {
        font-size: 55px;
        line-height: 1.1;
    }

    .vh-description {
        font-size: 19px;
        line-height: 1.5;
    }

    .vh-bottom-nav {
        max-width: 600px;
        gap: 10px;
    }

    .vh-nav-card {
        padding: 12px 14px;
    }

    .vh-nav-title {
        font-size: 13px;
    }

    .collaboration-mark {
        width: 39%;
        right: 3%;
        gap: 14px;
    }
}

/* =========================================
   TABLET RESPONSIVE
========================================= */

@media (max-width: 768px) {

    .hero,
    .vh-hero {
        min-height: 100vh;
        min-height: 100svh;
    }

    .vh-container {
        padding: 55px 25px 30px;
    }

    .vh-copy {
        width: 100%;
        max-width: 100%;
    }

    .vh-label {
        font-size: 22px;
        margin-bottom: 17px;
    }

    .vh-copy h1 {
        font-size: clamp(43px, 7vw, 54px);
        line-height: 1.1;
    }

    .vh-description {
        font-size: 18px;
        line-height: 1.55;
        margin-top: 20px;
    }

    .vh-bottom-nav {
        gap: 9px;
        margin-top: 26px;
    }

    .vh-nav-card {
        padding: 11px 12px;
        min-height: 52px;
    }

    .vh-nav-title {
        font-size: 12px;
    }

    .collaboration-mark {
        position: relative;

        top: auto;
        right: auto;

        transform: none;

        width: min(560px, 100%);

        margin: 55px auto 10px;

        gap: clamp(12px, 3vw, 24px);
    }

    .collaboration-mark__value {
        width: 44%;
    }

    .collaboration-mark__axs {
        width: 45%;
    }
}

/* =========================================
   MOBILE RESPONSIVE
========================================= */

@media (max-width: 600px) {

    .vh-container {
        padding: 40px 20px 25px;
    }

    .vh-label {
        font-size: 20px;
    }

    .vh-copy h1 {
        font-size: clamp(38px, 9vw, 49px);
        line-height: 1.12;
        letter-spacing: -.8px;
    }

    .vh-description {
        font-size: 16px;
        line-height: 1.6;
        margin-top: 17px;
    }

    .vh-bottom-nav {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 25px;
    }

    .vh-nav-card {
        min-height: 50px;
        padding: 12px 17px;
    }

    .vh-nav-title {
        font-size: 14px;
    }

    .collaboration-mark {
        width: 100%;
        margin-top: 40px;
        gap: 12px;
    }

    .collaboration-mark__divider {
        height: 32px;
    }

    .collaboration-mark__value {
        width: 43%;
    }

    .collaboration-mark__axs {
        width: 44%;
    }
}

/* SMALL MOBILE */

@media (max-width: 380px) {

    .vh-container {
        padding-left: 16px;
        padding-right: 16px;
    }

    .vh-copy h1 {
        font-size: 37px;
    }

    .vh-description {
        font-size: 15px;
    }

}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

    .vh-nav-card,
    .vh-nav-card::after {
        transition: none;
    }

    .collaboration-mark__logo {
        animation: none;
        opacity: 1;
        transform: none;
    }

    .collaboration-mark__divider {
        animation: none;
        transform: none;
    }
}


</style>
</head>

<body>

<!-- =========================================
     VALUE HEALTH HERO
========================================= -->

<section class="hero vh-hero" id="home">
    <canvas class="vh-particle-canvas" aria-hidden="true"></canvas>

    <!-- WEBGL PARTICLE BACKGROUND -->

    <canvas id="hero-canvas" aria-hidden="true"></canvas>

    <!-- BACKGROUND OVERLAY -->

    <div class="hero-overlay"></div>


    <!-- MAIN CONTENT -->

    <div class="vh-container">

        <!-- LEFT CONTENT -->

        <div class="vh-copy">

            <div class="vh-label">
                Meet Value Health
            </div>

            <h1>

                <span>patient access.</span>

    <!-- COLLABORATION LOGOS -->

    <div class="collaboration-mark"
         aria-label="Value Health in collaboration with AXS27">

        <img
            class="collaboration-mark__logo collaboration-mark__value"
            src="vh_logo-rmnmjan3x5vkno0d73f136whdky4375otns9avmt7a.png"
            alt="Value Health">

        <span
            class="collaboration-mark__divider"
            aria-hidden="true">
        </span>

            class="collaboration-mark__logo collaboration-mark__axs"
            src="Asembia_Logo-removebg-preview.png"
            alt="AXS27">

<!-- =========================================
     WEBGL PARTICLE ANIMATION
========================================= -->

<script>

(() => {

    const canvas = document.getElementById("hero-canvas");

    const gl = canvas.getContext("webgl", {
        alpha: true,
        antialias: false,
        powerPreference: "high-performance"
    });

    if (!gl) {
        console.error("WebGL is not supported.");
        return;
    }


    /* =====================================
       VERTEX SHADER
    ===================================== */

    const vertexShaderSource = `

        precision highp float;

        attribute vec3 aUvLayer;

        uniform float uTime;
        uniform float uAspect;
        uniform float uPointScale;
        uniform vec2 uMouse;

        varying float vIntensity;
        varying float vMix;


        vec3 mod289(vec3 x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 mod289(vec4 x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 permute(vec4 x) {
            return mod289(((x * 34.0) + 1.0) * x);
        }

        vec4 taylorInvSqrt(vec4 r) {
            return 1.79284291400159 - 0.85373472095314 * r;
        }


        float snoise(vec3 v) {

            const vec2 C = vec2(
                1.0 / 6.0,
                1.0 / 3.0
            );

            const vec4 D = vec4(
                0.0,
                0.5,
                1.0,
                2.0
            );

            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);

            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;

            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);

            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;

            i = mod289(i);

            vec4 p = permute(
                permute(
                    permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0)
                    )
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0)
                )
                + i.x + vec4(0.0, i1.x, i2.x, 1.0)
            );

            float n_ = 0.142857142857;

            vec3 ns = n_ * D.wyz - D.xzx;

            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);

            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;

            vec4 h = 1.0 - abs(x) - abs(y);

            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);

            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;

            vec4 sh = -step(h, vec4(0.0));

            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);

            vec4 norm = taylorInvSqrt(
                vec4(
                    dot(p0, p0),
                    dot(p1, p1),
                    dot(p2, p2),
                    dot(p3, p3)
                )
            );

            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;

            vec4 m = max(
                0.6 - vec4(
                    dot(x0, x0),
                    dot(x1, x1),
                    dot(x2, x2),
                    dot(x3, x3)
                ),
                0.0
            );

            m = m * m;

            return 42.0 * dot(
                m * m,
                vec4(
                    dot(p0, x0),
                    dot(p1, x1),
                    dot(p2, x2),
                    dot(p3, x3)
                )
            );
        }


        vec3 computeDisplacement(
            vec3 p,
            float t,
            float layerOffset
        ) {

            vec3 q = p * vec3(1.05, 1.35, 1.0)
                + vec3(0.0, 0.0, layerOffset * 1.7);

            float n1 = snoise(
                q + vec3(t * 0.14, -t * 0.09, t * 0.07)
            );

            float n2 = snoise(
                q * 1.85 + vec3(-t * 0.11, t * 0.12, 4.2)
            );

            float n3 = snoise(
                q * 3.1 - vec3(t * 0.08, t * 0.06, 9.7)
            );

            float angle = n1 * 2.6 + n2 * 1.1;

            vec3 flow = vec3(
                cos(angle) * 0.34 + n2 * 0.18,
                sin(angle) * 0.32 + n3 * 0.10,
                (n1 * 0.45 + n2 * 0.25)
            );

            return flow;
        }


        void main() {

            float t = uTime * 0.55;

            float layer = aUvLayer.z;

            vec3 basePos = vec3(
                aUvLayer.x * 1.48 * max(uAspect, 1.0),
                aUvLayer.y * 1.25,
                (layer - 1.0) * 0.32
            );

            vec2 mouseWorld = vec2(
                uMouse.x * uAspect,
                uMouse.y
            );

            float mouseDist = length(
                basePos.xy - mouseWorld
            );

            float mousePull = exp(-mouseDist * 1.4) * 0.18;

            vec3 disp = computeDisplacement(
                basePos * 0.72,
                t,
                layer
            );

            vec3 pos = basePos + disp;

            pos.xy += normalize(
                basePos.xy - mouseWorld + 0.0001
            ) * mousePull;

            pos.z += mousePull * 0.5;

            float eps = 0.04;

            vec3 dispDx = computeDisplacement(
                (basePos + vec3(eps, 0.0, 0.0)) * 0.72,
                t,
                layer
            );

            vec3 dispDy = computeDisplacement(
                (basePos + vec3(0.0, eps, 0.0)) * 0.72,
                t,
                layer
            );

            float fold = length(dispDx - disp)
                + length(dispDy - disp);

            float zCam = 2.25 - pos.z;

            vec2 projected = vec2(
                pos.x / (zCam * uAspect),
                pos.y / zCam
            ) * 1.65;

            float edgeFade =
                smoothstep(1.28, 0.78, abs(projected.y)) *
                smoothstep(1.35, 0.85, abs(projected.x));

            vMix = clamp(
                fold * 4.8 + (pos.z + 0.5) * 0.35,
                0.0,
                1.0
            );

            vIntensity = (0.14 + vMix * 0.52) * edgeFade;

            gl_Position = vec4(projected, 0.0, 1.0);

            gl_PointSize = clamp(
                (1.55 + vMix * 1.25) * uPointScale / zCam,
                1.0,
                4.0
            );
        }

    `;


    /* =====================================
       FRAGMENT SHADER
    ===================================== */

    const fragmentShaderSource = `

        precision highp float;

        varying float vIntensity;
        varying float vMix;

        void main() {

            vec2 coord = gl_PointCoord - vec2(0.5);

            float dist = length(coord);

            if (dist > 0.5) discard;

            float alpha = smoothstep(0.5, 0.05, dist)
                * vIntensity;

            vec3 deepBlue = vec3(0.20, 0.34, 0.95);

            vec3 softLavender = vec3(0.55, 0.68, 1.0);

            vec3 icyWhite = vec3(0.95, 0.97, 1.0);

            vec3 color = mix(
                deepBlue,
                softLavender,
                smoothstep(0.0, 0.6, vMix)
            );

            color = mix(
                color,
                icyWhite,
                smoothstep(0.52, 1.0, vMix)
            );

            gl_FragColor = vec4(color, alpha);
        }

    `;


    /* =====================================
       SHADER CREATION
    ===================================== */

    function createShader(type, source) {

        const shader = gl.createShader(type);

        gl.shaderSource(shader, source);

        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {

            console.error(gl.getShaderInfoLog(shader));

            gl.deleteShader(shader);

            return null;
        }

        return shader;
    }


    const vertexShader = createShader(
        gl.VERTEX_SHADER,
        vertexShaderSource
    );

    const fragmentShader = createShader(
        gl.FRAGMENT_SHADER,
        fragmentShaderSource
    );

    if (!vertexShader || !fragmentShader) return;


    const program = gl.createProgram();

    gl.attachShader(program, vertexShader);

    gl.attachShader(program, fragmentShader);

    gl.linkProgram(program);


    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {

        console.error(gl.getProgramInfoLog(program));

        return;
    }

    gl.useProgram(program);


    /* =====================================
       PARTICLE GENERATION
       3 LAYERS - 72,000 PARTICLES
    ===================================== */

    const layers = 3;

    const cols = 200;

    const rows = 120;

    const totalParticles = layers * cols * rows;

    const data = new Float32Array(totalParticles * 3);

    let idx = 0;


    for (let l = 0; l < layers; l++) {

        for (let y = 0; y < rows; y++) {

            for (let x = 0; x < cols; x++) {

                const jx = (Math.random() - 0.5) * (2 / cols);

                const jy = (Math.random() - 0.5) * (2 / rows);

                data[idx++] = (x / (cols - 1)) * 2 - 1 + jx;

                data[idx++] = (y / (rows - 1)) * 2 - 1 + jy;

                data[idx++] = l;
            }
        }
    }


    const buffer = gl.createBuffer();

    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    gl.bufferData(
        gl.ARRAY_BUFFER,
        data,
        gl.STATIC_DRAW
    );


    const aUvLayer = gl.getAttribLocation(
        program,
        "aUvLayer"
    );

    gl.enableVertexAttribArray(aUvLayer);

    gl.vertexAttribPointer(
        aUvLayer,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );


    /* =====================================
       UNIFORMS
    ===================================== */

    const uTime = gl.getUniformLocation(program, "uTime");

    const uAspect = gl.getUniformLocation(program, "uAspect");

    const uPointScale = gl.getUniformLocation(program, "uPointScale");

    const uMouse = gl.getUniformLocation(program, "uMouse");


    /* =====================================
       ADDITIVE BLENDING
    ===================================== */

    gl.enable(gl.BLEND);

    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);


    /* =====================================
       RESPONSIVE RESIZE
    ===================================== */

    let dpr = 1;

    let width = 0;

    let height = 0;


    function resize() {

        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = canvas.clientWidth;

        height = canvas.clientHeight;

        canvas.width = Math.floor(width * dpr);

        canvas.height = Math.floor(height * dpr);

        gl.viewport(
            0,
            0,
            canvas.width,
            canvas.height
        );
    }


    window.addEventListener("resize", resize);

    resize();


    /* =====================================
       CURSOR INTERACTION
    ===================================== */

    const mouse = {
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0
    };


    canvas.addEventListener("pointermove", (e) => {

        const rect = canvas.getBoundingClientRect();

        mouse.targetX =
            ((e.clientX - rect.left) / rect.width) * 2 - 1;

        mouse.targetY =
            -(((e.clientY - rect.top) / rect.height) * 2 - 1);

    });


    canvas.addEventListener("pointerleave", () => {

        mouse.targetX = 0;

        mouse.targetY = 0;

    });


    /* =====================================
       RENDER ANIMATION
    ===================================== */

    const startTime = performance.now();


    function render(now) {

        const elapsed = (now - startTime) * 0.001;

        mouse.x += (mouse.targetX - mouse.x) * 0.05;

        mouse.y += (mouse.targetY - mouse.y) * 0.05;


        gl.clearColor(0, 0, 0, 0);

        gl.clear(gl.COLOR_BUFFER_BIT);


        gl.uniform1f(uTime, elapsed);

        gl.uniform1f(
            uAspect,
            width / Math.max(height, 1)
        );

        gl.uniform1f(uPointScale, dpr);

        gl.uniform2f(
            uMouse,
            mouse.x,
            mouse.y
        );


        gl.drawArrays(
            gl.POINTS,
            0,
            totalParticles
        );


        requestAnimationFrame(render);
    }


    requestAnimationFrame(render);


})();

</script>
